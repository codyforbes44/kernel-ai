<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="borderGradientApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
    <filter id="glowApple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlowApple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background - solid for iOS -->
  <rect width="180" height="180" fill="#0a0a0f"/>
  
  <!-- Outer glow -->
  <rect x="20" y="20" width="140" height="140" rx="28" ry="28" fill="#00d4ff" opacity="0.08" filter="url(#glowApple)"/>
  
  <!-- Gradient border -->
  <rect x="28" y="28" width="124" height="124" rx="24" ry="24" fill="none" stroke="url(#borderGradientApple)" stroke-width="2.5"/>
  
  <!-- Inner background -->
  <rect x="32" y="32" width="116" height="116" rx="20" ry="20" fill="#0a0a0f"/>
  
  <!-- Diamond neural pattern -->
  <g opacity="0.3" stroke="#00d4ff" fill="none">
    <path d="M90 44 L136 90 L90 136 L44 90 Z" stroke-width="0.75"/>
    <path d="M90 60 L120 90 L90 120 L60 90 Z" stroke-width="0.5"/>
    <circle cx="90" cy="90" r="3" fill="#00d4ff"/>
    <circle cx="90" cy="44" r="2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="136" cy="90" r="2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="90" cy="136" r="2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="44" cy="90" r="2" fill="#00d4ff" opacity="0.6"/>
  </g>
  
  <!-- Corner accents -->
  <path d="M24 40 L24 24 L40 24" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.4"/>
  <path d="M156 40 L156 24 L140 24" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.4"/>
  <path d="M24 140 L24 156 L40 156" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.4"/>
  <path d="M156 140 L156 156 L140 156" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.4"/>
  
  <!-- Glyph -->
  <text x="90" y="102" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="44" font-weight="bold" fill="#00d4ff" text-anchor="middle" filter="url(#textGlowApple)">&gt;_</text>
</svg>
