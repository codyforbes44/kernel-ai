<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background - solid for iOS -->
  <rect width="180" height="180" fill="#0a0a0f"/>
  
  <!-- Outer glow -->
  <rect x="18" y="18" width="144" height="144" rx="32" ry="32" fill="#00d4ff" opacity="0.1" filter="url(#glow)"/>
  
  <!-- Gradient border -->
  <rect x="27" y="27" width="126" height="126" rx="27" ry="27" fill="none" stroke="url(#borderGradient)" stroke-width="3"/>
  
  <!-- Inner background -->
  <rect x="30" y="30" width="120" height="120" rx="24" ry="24" fill="#0a0a0f"/>
  
  <!-- Diamond pattern -->
  <g opacity="0.25" stroke="#00d4ff" fill="none">
    <path d="M90 45 L135 90 L90 135 L45 90 Z" stroke-width="0.8"/>
    <path d="M90 63 L117 90 L90 117 L63 90 Z" stroke-width="0.5"/>
    <circle cx="90" cy="90" r="5" fill="#00d4ff"/>
    <circle cx="90" cy="45" r="3" fill="#00d4ff" opacity="0.6"/>
    <circle cx="135" cy="90" r="3" fill="#00d4ff" opacity="0.6"/>
    <circle cx="90" cy="135" r="3" fill="#00d4ff" opacity="0.6"/>
    <circle cx="45" cy="90" r="3" fill="#00d4ff" opacity="0.6"/>
  </g>
  
  <!-- Corner accents -->
  <path d="M22 36 L22 22 L36 22" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.3"/>
  <path d="M158 36 L158 22 L144 22" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.3"/>
  <path d="M22 144 L22 158 L36 158" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.3"/>
  <path d="M158 144 L158 158 L144 158" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.3"/>
  
  <!-- Glyph -->
  <text x="90" y="102" font-family="monospace" font-size="48" font-weight="bold" fill="#00d4ff" text-anchor="middle" filter="url(#glow)">&gt;_</text>
</svg>
