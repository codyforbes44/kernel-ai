<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" fill="#0a0a0f"/>
  
  <!-- Gradient border -->
  <rect x="10" y="10" width="44" height="44" rx="10" ry="10" fill="none" stroke="url(#borderGradient)" stroke-width="2"/>
  
  <!-- Inner background -->
  <rect x="12" y="12" width="40" height="40" rx="8" ry="8" fill="#0a0a0f"/>
  
  <!-- Diamond pattern -->
  <g opacity="0.25" stroke="#00d4ff" fill="none">
    <path d="M32 18 L46 32 L32 46 L18 32 Z" stroke-width="0.5"/>
    <path d="M32 24 L40 32 L32 40 L24 32 Z" stroke-width="0.3"/>
    <circle cx="32" cy="32" r="2" fill="#00d4ff"/>
  </g>
  
  <!-- Glyph -->
  <text x="32" y="39" font-family="monospace" font-size="18" font-weight="bold" fill="#00d4ff" text-anchor="middle" filter="url(#glow)">&gt;_</text>
</svg>
