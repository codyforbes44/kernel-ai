<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="borderGradient192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
    <filter id="glow192" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow192" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" fill="#0a0a0f"/>
  
  <!-- Outer glow -->
  <rect x="24" y="24" width="144" height="144" rx="32" ry="32" fill="#00d4ff" opacity="0.08" filter="url(#glow192)"/>
  
  <!-- Gradient border -->
  <rect x="32" y="32" width="128" height="128" rx="24" ry="24" fill="none" stroke="url(#borderGradient192)" stroke-width="2.5"/>
  
  <!-- Inner background -->
  <rect x="36" y="36" width="120" height="120" rx="20" ry="20" fill="#0a0a0f"/>
  
  <!-- Diamond neural pattern -->
  <g opacity="0.3" stroke="#00d4ff" fill="none">
    <!-- Outer diamond -->
    <path d="M96 48 L144 96 L96 144 L48 96 Z" stroke-width="0.75"/>
    <!-- Inner diamond -->
    <path d="M96 64 L128 96 L96 128 L64 96 Z" stroke-width="0.5"/>
    <!-- Center dot -->
    <circle cx="96" cy="96" r="3" fill="#00d4ff"/>
    <!-- Corner dots -->
    <circle cx="96" cy="48" r="2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="144" cy="96" r="2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="96" cy="144" r="2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="48" cy="96" r="2" fill="#00d4ff" opacity="0.6"/>
  </g>
  
  <!-- Corner accents -->
  <path d="M28 44 L28 28 L44 28" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.4"/>
  <path d="M164 44 L164 28 L148 28" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.4"/>
  <path d="M28 148 L28 164 L44 164" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.4"/>
  <path d="M164 148 L164 164 L148 164" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.4"/>
  
  <!-- Glyph -->
  <text x="96" y="108" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="48" font-weight="bold" fill="#00d4ff" text-anchor="middle" filter="url(#textGlow192)">&gt;_</text>
</svg>